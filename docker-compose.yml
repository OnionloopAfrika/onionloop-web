services:
  onionloop-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: onionloop-web
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3